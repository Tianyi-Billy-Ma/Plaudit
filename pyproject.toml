[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plaudit"
version = "0.1.0"
description = "Meeting recordings from any device to speaker-labelled transcripts and summaries, on hardware you control. First-class Chinese + English."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
gpu = ["transformers>=5.19", "torch", "torchaudio", "scipy", "numpy", "librosa"]  # torchaudio + scipy: ReDimNet2 features
sherpa = ["sherpa-onnx>=1.12", "numpy"]  # `speakers.backend: sherpa`, ONNX speaker models on the CPU
whisper = ["faster-whisper>=1.1", "numpy"]
notify = ["apprise>=1.9"]
dev = ["pytest", "numpy", "apprise>=1.9"]  # numpy: the Whisper backend test builds a float clip

[project.scripts]
plaudit = "plaudit.cli:main"

[project.urls]
Homepage = "https://github.com/Tianyi-Billy-Ma/Plaudit"

[tool.hatch.build.targets.wheel]
packages = ["src/plaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
