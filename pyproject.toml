[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plaudit"
version = "0.1.0"
description = "Meeting recordings from any device to speaker-labelled transcripts and summaries, on hardware you control. First-class Chinese + English."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
gpu = ["transformers>=5.19", "torch", "numpy", "librosa"]
dev = ["pytest"]

[project.scripts]
plaudit = "plaudit.cli:main"

[project.urls]
Homepage = "https://github.com/Tianyi-Billy-Ma/Plaudit"

[tool.hatch.build.targets.wheel]
packages = ["src/plaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
