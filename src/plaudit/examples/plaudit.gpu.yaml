# Plaudit reference config: local models on one GPU box, summary through an OpenAI-compatible endpoint.
# Lives in ~/.config/plaudit/ with .env (secrets, KEY=value lines), glossary.txt and voices/ next to it.
# data_dir: ~/.local/share/plaudit   # queue state and finished jobs; the default
# glossary: glossary.txt next to this file by default
language: null            # auto-detect; or "Chinese" / "English"

sources:
  folder:
    path: ~/plaudit/inbox
  plaud:
    enabled: true          # needs `plaud login` once
    lookback_days: 7
  # rclone:
  #   remote: dropbox:Recordings   # audio dropped here is moved into the watched folder every run
  # upload:
  #   port: 8787           # `plaudit serve`; token from $PLAUDIT_UPLOAD_TOKEN

diarization:
  backend: nemotron        # or none
  model: nvidia/Nemotron-3-Diarization
  max_turn_seconds: 30

speakers:                  # who is Speaker 2: one audio sample per person in `voices` (张三.wav, Billy.m4a)
  backend: redimnet2       # redimnet2 (default, best on Chinese + English), xvector (any HF *ForXVector model) or sherpa (ONNX, CPU)
  model: b6                # ReDimNet2 size; b3 on a CPU box. xvector: a HF id; sherpa: path of the .onnx file
  # voices: ~/.config/plaudit/voices   # the default: next to this file
  # threshold: 0.5         # cosine similarity needed for a match; the log shows every speaker's best score

transcription:
  backend: qwen_asr
  model: Qwen/Qwen3-ASR-1.7B-hf

summary:
  base_url: http://localhost:8000/v1    # any OpenAI-compatible server (CPA, vLLM, Ollama, OpenAI)
  model: glm-5.3-flash
  api_key_env: OPENAI_API_KEY
  language: zh             # zh: 摘要/决定/行动项 with English terms kept; en: Summary/Decisions/Action items
  chunk_chars: 12000
  reasoning_effort: none   # reasoning models (GLM, Qwen3, DeepSeek) otherwise think for minutes per chunk; drop for plain models

outputs:
  markdown:
    dir: ~/plaudit/notes   # one YYYY-MM-DD <title>.md per meeting; `plaudit run file.m4a out.md` overrides it
  notion:
    database_id: null      # set to publish one page per meeting; token from $NOTION_TOKEN
    token_env: NOTION_TOKEN
    # status_done: Done       # option names when the database has its own Status column
    # status_stuck: WIP
  # webhook:                # one JSON POST per meeting (n8n, Zapier, Home Assistant...)
  #   url: https://n8n.example/webhook/plaudit   # or url_env: PLAUDIT_WEBHOOK_URL when the URL carries a token
  # notify:                 # Slack, Discord, Teams, Telegram, e-mail... as Apprise URLs (pip install 'plaudit[notify]')
  #   urls: [ntfy://ntfy.sh/plaudit]              # URLs with tokens go in $PLAUDIT_NOTIFY_URLS, not here

backup:
  remote: gdrive:Meetings  # rclone remote; null to disable. Files land in YYYY/MM/<job>/
retention_days: 7          # delete local copies this long after a verified backup
min_free_mem_gb: 8         # do not start a job below this MemAvailable
