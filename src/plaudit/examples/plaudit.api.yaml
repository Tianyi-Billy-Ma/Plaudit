# Plaudit without a GPU: transcription and summary over HTTP, Markdown output only.
data_dir: ~/plaudit/data
glossary: ~/plaudit/glossary.txt
# Secrets: environment variables, or a .env file next to this one (KEY=value lines).

sources:
  folder:
    path: ~/plaudit/inbox

diarization:
  backend: none   # nemotron works on the CPU too (pip install "plaudit[gpu]"): speaker labels without a GPU

transcription:
  backend: openai
  base_url: http://localhost:8080/v1   # e.g. a whisper.cpp server or qwen-asr-serve
  model: whisper-1
  api_key_env: PLAUDIT_ASR_API_KEY

summary:
  provider: ollama   # or vllm, lmstudio, openai, anthropic, gemini, deepseek, groq, openrouter; or set base_url yourself
  model: qwen3:8b
  language: en
  reasoning_effort: none

outputs:
  markdown:
    dir: ~/plaudit/data/notes

backup:
  remote: null
