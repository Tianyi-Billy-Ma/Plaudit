# Plaudit without a GPU: transcription and summary over HTTP, Markdown output only.
# Lives in ~/.config/plaudit/ with .env (secrets, KEY=value lines) and glossary.txt next to it.

sources:
  folder:
    path: ~/plaudit/inbox

diarization:
  backend: none   # nemotron works on the CPU too (pip install "plaudit[gpu]"): speaker labels without a GPU

# speakers:       # with diarization on: name the speakers from voice samples in ~/plaudit/voices (张三.wav ...)
#   backend: sherpa                    # ONNX on the CPU, pip install "plaudit[sherpa]"
#   model: ~/plaudit/3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx   # from the sherpa-onnx speaker models release

transcription:
  backend: openai
  base_url: http://localhost:8080/v1   # e.g. a whisper.cpp server or qwen-asr-serve
  model: whisper-1
  api_key_env: PLAUDIT_ASR_API_KEY

summary:
  provider: ollama   # or vllm, lmstudio, openai, anthropic, gemini, deepseek, groq, openrouter; or set base_url yourself
  model: qwen3:8b
  language: en
  reasoning_effort: none

outputs:
  markdown:
    dir: ~/plaudit/notes

backup:
  remote: null
