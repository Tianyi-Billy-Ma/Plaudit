# One short-lived container per run. Secrets come from the caller's environment, e.g.
#   set -a; . ~/.config/secrets.env; set +a; docker compose run --rm plaudit
services:
  plaudit:
    build: .
    image: plaudit:0.1.0
    environment:                             # only the ones set in the caller's environment are passed
      - OPENAI_API_KEY
      - NOTION_TOKEN
      - PLAUDIT_ASR_API_KEY
      - PLAUDIT_WEBHOOK_URL
      - PLAUDIT_NOTIFY_URLS
    volumes:
      - ${HOME}/plaudit:/plaudit               # plaudit.yaml, glossary.txt, data/
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface   # shared Hugging Face model cache
      - ${HOME}/.cache/torch:/root/.cache/torch   # ReDimNet2 speaker model (torch.hub)
      - /etc/localtime:/etc/localtime:ro       # meeting dates in local time
      - ${HOME}/.plaud:/root/.plaud            # Plaud CLI login
      - ${HOME}/.config/rclone:/root/.config/rclone:ro   # read-only so token refreshes do not leave a root-owned file
    mem_limit: 7g
    memswap_limit: 7g
    deploy:                 # delete this block on a machine without an NVIDIA GPU (CPU/API profile)
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
