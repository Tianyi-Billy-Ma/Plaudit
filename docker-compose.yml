# One short-lived container per run. Secrets come from the caller's environment, e.g.
#   op run --environment "$OP_ENVIRONMENT_ID" -- docker compose run --rm plaudit
services:
  plaudit:
    build: .
    image: plaudit:0.1.0
    environment:
      - PLAUDIT_SUMMARY_API_KEY
      - NOTION_TOKEN
    volumes:
      - ${HOME}/plaudit:/plaudit               # plaudit.yaml, glossary.txt, data/, hf/ model cache
      - ${HOME}/.plaud:/root/.plaud            # Plaud CLI login
      - ${HOME}/.config/rclone:/root/.config/rclone
    mem_limit: 7g
    memswap_limit: 7g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
